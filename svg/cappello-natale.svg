<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <!-- Gradiente Corpo Cappello Rosso Natalizio -->
    <linearGradient id="hatRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="35%" stop-color="#d61124"/>
      <stop offset="85%" stop-color="#930816"/>
      <stop offset="100%" stop-color="#6b030d"/>
    </linearGradient>

    <!-- Ombra interna piega -->
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Gradiente Bianco Soffice Pelliccia -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#d9e1e8"/>
    </linearGradient>

    <!-- Gradiente Pon-Pon -->
    <radialGradient id="pomponGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f7fa"/>
      <stop offset="85%" stop-color="#dce3ea"/>
      <stop offset="100%" stop-color="#b6c2ce"/>
    </radialGradient>

    <!-- Ombra Filtro Realistica -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#shadowFilter)">
    <!-- Coda del cappello che scende a destra -->
    <path d="M 100,52 C 122,50 142,65 141,88 C 140,102 128,108 122,106 C 116,104 120,90 123,82 C 126,72 115,62 98,62 Z" 
          fill="url(#hatRed)" />
    <path d="M 100,52 C 122,50 142,65 141,88 C 140,102 128,108 122,106 C 116,104 120,90 123,82 C 126,72 115,62 98,62 Z" 
          fill="url(#foldShadow)" opacity="0.45" />

    <!-- Corpo principale triangolare incurvato del cappello -->
    <path d="M 22,86 C 26,45 52,18 90,20 C 112,21 126,38 120,58 C 102,52 82,60 68,70 C 50,83 34,88 22,86 Z" 
          fill="url(#hatRed)" />

    <!-- Riflesso di luce morbido sulla cupola -->
    <path d="M 38,76 C 45,48 64,30 88,27 C 82,35 60,46 48,68 C 44,75 40,78 38,76 Z" 
          fill="#ffffff" opacity="0.22" />

    <!-- Pon-pon soffice alla punta -->
    <g transform="translate(122, 105)">
      <!-- Texture ciuffi pon-pon -->
      <circle cx="0" cy="0" r="16" fill="url(#pomponGrad)"/>
      <circle cx="-6" cy="-5" r="8" fill="#ffffff" opacity="0.8"/>
      <circle cx="5" cy="-6" r="7" fill="#ffffff" opacity="0.8"/>
      <circle cx="-7" cy="4" r="6" fill="#f0f3f6" opacity="0.9"/>
      <circle cx="6" cy="5" r="7" fill="#e2e8f0" opacity="0.9"/>
      <circle cx="0" cy="7" r="6" fill="#cbd5e1" opacity="0.8"/>
    </g>

    <!-- Bordo di pelliccia bianca sofficissima (nuvola a sbuffi) -->
    <g>
      <!-- Base e contorno della fascia bianca -->
      <path d="M 14,92 C 14,84 22,80 30,80 L 110,72 C 118,72 126,78 125,86 C 124,96 116,104 106,105 L 26,112 C 16,113 13,102 14,92 Z" 
            fill="url(#furGrad)" stroke="#e2e8f0" stroke-width="0.8" />
      
      <!-- Sbuffi di pelliccia in rilievo -->
      <circle cx="20" cy="95" r="11" fill="url(#furGrad)" />
      <circle cx="36" cy="94" r="12" fill="url(#furGrad)" />
      <circle cx="53" cy="92" r="12.5" fill="url(#furGrad)" />
      <circle cx="71" cy="90" r="12.5" fill="url(#furGrad)" />
      <circle cx="89" cy="88" r="12" fill="url(#furGrad)" />
      <circle cx="106" cy="86" r="11" fill="url(#furGrad)" />
      <circle cx="118" cy="87" r="10" fill="url(#furGrad)" />
      
      <!-- Luce soffice sopra gli sbuffi -->
      <ellipse cx="36" cy="90" rx="8" ry="5" fill="#ffffff" opacity="0.9" />
      <ellipse cx="53" cy="87" rx="9" ry="5" fill="#ffffff" opacity="0.9" />
      <ellipse cx="71" cy="85" rx="9" ry="5" fill="#ffffff" opacity="0.9" />
      <ellipse cx="89" cy="84" rx="8" ry="5" fill="#ffffff" opacity="0.9" />
      <ellipse cx="106" cy="83" rx="7" ry="4" fill="#ffffff" opacity="0.9" />
    </g>
  </g>
</svg>
